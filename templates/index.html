{% extends "base.html" %}

{% block title %}Users{% endblock %}

{% block content %}
<h1>Users</h1>
<p><a class="new" href="{{ url_for('new_user') }}">+ New user</a></p>

<table>
  <thead>
    <tr><th>ID</th><th>Name</th><th>Email</th><th>Actions</th></tr>
  </thead>
  <tbody>
    {% for user in users %}
    <tr>
      <td>{{ user.id }}</td>
      <td>{{ user.name }}</td>
      <td>{{ user.email }}</td>
      <td class="actions">
        <a href="{{ url_for('edit_user', user_id=user.id) }}">Update</a>
        <a href="{{ url_for('patch_form', user_id=user.id) }}">Patch</a>
        <form data-method="delete" action="{{ url_for('delete_user', user_id=user.id) }}" method="post">
          <button type="submit">Delete</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4">No users yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
